<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prada 女裝目錄</title><link rel="stylesheet" href="style.css?v=6"></head><body>
<header>
<h1 id="pageTitle">PRADA 女裝目錄</h1>
<div class="dept" id="dept">
  <button type="button" data-d="bags" class="on">手袋</button>
  <button type="button" data-d="rtw">成衣</button>
</div>
<div class="filters">
<input id="q" type="search" placeholder="搜尋名稱或貨號">
<select id="cat"><option value="">全部總類</option></select>
<select id="line"><option value="">全部系列</option></select>
<div class="color-dd" id="colorWrap">
  <button type="button" class="color-dd-btn" id="colorBtn" aria-haspopup="listbox" aria-expanded="false">
    <span class="color-dd-label" id="colorBtnLabel">全部顏色</span>
    <span class="color-dot" id="colorBtnDot" hidden></span>
  </button>
  <div class="color-dd-menu" id="colorMenu" role="listbox" hidden></div>
</div>
<input type="hidden" id="color" value="">
<select id="matCat"><option value="">全部物料</option></select>
<select id="leatherType" hidden><option value="">全部皮革類型</option></select>
<select id="owLen" hidden><option value="">全部長度</option></select>
<select id="price"><option value="">全部價錢</option><option value="0-10000">HK$10,000 以下</option><option value="10000-20000">HK$10,000–20,000</option><option value="20000-30000">HK$20,000–30,000</option><option value="30000-50000">HK$30,000–50,000</option><option value="50000-9999999">HK$50,000 以上</option></select>
<select id="sort"><option value="">預設排序</option><option value="pa">價錢由低至高</option><option value="pd">價錢由高至低</option></select>
</div>
</header>
<div class="count" id="count">載入中…</div><div class="grid" id="grid"></div>
<div class="bar"><span id="n">已揀 0 款</span><button class="clr" id="clr">清除</button><button class="go" id="share">分享俾客人</button></div>
<script>
const TABS={
  bags:[['','全部總類'],['shoulder','肩背包'],['mini','迷你手袋'],['tote','托特包'],['top','手挽包'],['backpack','背囊'],['briefcase','公事包']],
  rtw:[['','全部總類'],['outerwear','外套'],['jackets','外套與大衣'],['knitwear','針織'],['dresses','連身裙'],['shirts','恤衫與上衣'],['tshirts','T恤與衛衣'],['trousers','長褲與短褲'],['skirts','半身裙'],['denim','牛仔'],['leather_clothing','皮革服裝'],['pajamas','睡衣與內衣'],['underwear_beach','內衣與沙灘裝'],['swimwear','泳裝']]
};
const MAT_BAGS=[['leather','皮革'],['nylon','尼龍'],['other','其他']];
const MAT_RTW=[['leather','皮革'],['wool_cashmere','羊毛／羊絨'],['nylon','尼龍'],['cotton_linen','棉／麻'],['silk_other','絲／其他']];
const LEATHER_TYPES=[['saffiano','Saffiano'],['nappa','Nappa'],['vernice','Vernice'],['suede','Suede'],['other_leather','其他皮革']];
const OW_LENS=[['long','長外套'],['short','短外套']];
const OW_TABS=new Set(['outerwear','jackets','leather_clothing']);
/* Preferred color order: 黑白紅橙黃綠藍紫金銀, then leftovers */
const COLOR_ORDER=[
  {group:'黑色',label:'黑',hex:'#111111'},
  {group:'白色',label:'白',hex:'#ffffff'},
  {group:'紅色',label:'紅',hex:'#c41230'},
  {group:'橙色',label:'橙',hex:'#e25a17'},
  {group:'黃色',label:'黃',hex:'#e6c200'},
  {group:'綠色',label:'綠',hex:'#2d6a2d'},
  {group:'藍色',label:'藍',hex:'#3c5b76'},
  {group:'紫色',label:'紫',hex:'#6b3fa0'},
  {group:'金色',label:'金',hex:'#c9a84c'},
  {group:'銀色',label:'銀',hex:'#c0c0c0'},
  {group:'金色／銀色',label:'金／銀',hex:'#c9a84c'}
];
const COLOR_REST=[
  {group:'粉紅色',label:'粉紅',hex:'#e8a0b0'},
  {group:'淺藍',label:'淺藍',hex:'#a8c8e0'},
  {group:'灰色',label:'灰',hex:'#888888'},
  {group:'啡色',label:'啡',hex:'#8b5a2b'},
  {group:'無色',label:'無色',hex:'#edeae3'}
];
const COLOR_HEX={};
[...COLOR_ORDER,...COLOR_REST].forEach(c=>{COLOR_HEX[c.group]=c.hex;});
const DATA_VER='20261015catcolor';
let ALL=[],P=[],dept='bags',tab='',matCat='',leatherType='',owLen='',sel=new Set(JSON.parse(localStorage.getItem('sel')||'[]'));
const $=id=>document.getElementById(id),fmt=n=>'HK$ '+n.toLocaleString('en');
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function matCatOf(p){return p.primary_material_category||''}
function leatherOf(p){return p.leather_type||''}
function owOf(p){return p.outerwear_length||''}
function matLabel(p){
  if(p.department==='rtw'){
    const m={leather:'皮革',wool_cashmere:'羊毛／羊絨',nylon:'尼龍',cotton_linen:'棉／麻',silk_other:'絲／其他'};
    if(matCatOf(p)==='leather'){
      const lt={saffiano:'Saffiano',nappa:'Nappa',vernice:'Vernice',suede:'Suede',other_leather:'皮革'};
      return lt[leatherOf(p)]||'皮革';
    }
    return m[matCatOf(p)]||(p.material||'');
  }
  if(matCatOf(p)==='nylon') return '尼龍';
  if(matCatOf(p)==='other') return '其他';
  const m={saffiano:'Saffiano',nappa:'Nappa',vernice:'Vernice',suede:'Suede',other_leather:'皮革'};
  return m[leatherOf(p)]||'皮革';
}
function fillSelect(id,vals){
  const el=$(id), cur=el.value;
  el.innerHTML='';
  el.add(new Option(id==='line'?'全部系列':'全部顏色',''));
  [...new Set(vals)].filter(Boolean).sort().forEach(v=>el.add(new Option(v,v)));
  if([...el.options].some(o=>o.value===cur)) el.value=cur;
}
function countBy(list, keyFn){
  const c={};
  list.forEach(p=>{const k=keyFn(p); if(!k) return; c[k]=(c[k]||0)+1;});
  return c;
}
function colorMeta(group){
  const known=[...COLOR_ORDER,...COLOR_REST].find(c=>c.group===group);
  if(known) return known;
  return {group,label:group,hex:COLOR_HEX[group]||'#cccccc'};
}
function orderedColorGroups(present){
  const set=new Set(present);
  const out=[];
  COLOR_ORDER.forEach(c=>{ if(set.has(c.group)){ out.push(c); set.delete(c.group); }});
  COLOR_REST.forEach(c=>{ if(set.has(c.group)){ out.push(c); set.delete(c.group); }});
  [...set].sort().forEach(g=>out.push(colorMeta(g)));
  return out;
}
function closeColorMenu(){
  $('colorMenu').hidden=true;
  $('colorBtn').setAttribute('aria-expanded','false');
}
function setColorValue(v){
  $('color').value=v||'';
  const btnLabel=$('colorBtnLabel'), btnDot=$('colorBtnDot');
  if(!v){
    btnLabel.textContent='全部顏色';
    btnDot.hidden=true;
  }else{
    const m=colorMeta(v);
    btnLabel.textContent=m.label;
    btnDot.style.background=m.hex;
    btnDot.hidden=false;
  }
  closeColorMenu();
}
function rebuildColorSelect(){
  const present=[...new Set(P.map(p=>p.color_group).filter(Boolean))];
  const ordered=orderedColorGroups(present);
  const cur=$('color').value;
  const menu=$('colorMenu');
  let html=`<button type="button" role="option" data-v="" class="color-opt${!cur?' on':''}"><span>全部顏色</span></button>`;
  ordered.forEach(c=>{
    const on=cur===c.group?' on':'';
    html+=`<button type="button" role="option" data-v="${esc(c.group)}" class="color-opt${on}"><span>${esc(c.label)}</span><span class="color-dot" style="background:${c.hex}"></span></button>`;
  });
  menu.innerHTML=html;
  if(cur && !present.includes(cur)) setColorValue('');
  else setColorValue($('color').value);
}
function rebuildCatSelect(){
  const el=$('cat');
  const prev=tab;
  el.innerHTML='';
  TABS[dept].forEach(([k,l])=>el.add(new Option(l,k)));
  if(prev && ![...el.options].some(o=>o.value===prev)) tab='';
  el.value=tab;
}
function rebuildMatSelects(){
  const defs=dept==='bags'?MAT_BAGS:MAT_RTW;
  const catCounts=countBy(P, matCatOf);
  const matEl=$('matCat');
  const prevMat=matCat;
  matEl.innerHTML='';
  matEl.add(new Option('全部物料',''));
  defs.forEach(([k,l])=>{
    const n=catCounts[k]||0;
    if(n>0) matEl.add(new Option(l+'（'+n+'）',k));
  });
  if(prevMat && ![...matEl.options].some(o=>o.value===prevMat)) matCat='';
  matEl.value=matCat;
  rebuildLeatherSelect();
}
function rebuildLeatherSelect(){
  const leatherProds=P.filter(p=>matCatOf(p)==='leather');
  const typeCounts=countBy(leatherProds, leatherOf);
  const el=$('leatherType');
  const prev=leatherType;
  el.innerHTML='';
  el.add(new Option('全部皮革類型',''));
  LEATHER_TYPES.forEach(([k,l])=>{
    const n=typeCounts[k]||0;
    if(n>0) el.add(new Option(l+'（'+n+'）',k));
  });
  if(prev && ![...el.options].some(o=>o.value===prev)) leatherType='';
  el.value=leatherType;
  const hasTypes=el.options.length>1;
  el.hidden=!(matCat==='leather' && hasTypes);
  if(el.hidden) leatherType='';
}
function rebuildOwSelect(){
  const showOw=dept==='rtw' && OW_TABS.has(tab);
  const el=$('owLen');
  if(!showOw){
    el.hidden=true;
    owLen='';
    return;
  }
  const base=P.filter(p=>(p.subcats||[]).includes(tab));
  const lenCounts=countBy(base, owOf);
  const prev=owLen;
  el.innerHTML='';
  el.add(new Option('全部長度',''));
  OW_LENS.forEach(([k,l])=>{
    const n=lenCounts[k]||0;
    if(n>0) el.add(new Option(l+'（'+n+'）',k));
  });
  if(prev && ![...el.options].some(o=>o.value===prev)) owLen='';
  el.value=owLen;
  el.hidden=el.options.length<=1;
}
function setDept(d){
  dept=d;
  tab='';
  owLen='';
  [...$('dept').children].forEach(b=>b.classList.toggle('on',b.getAttribute('data-d')===dept));
  P=ALL.filter(p=>p.department===dept);
  rebuildCatSelect();
  fillSelect('line',P.map(p=>p.line));
  rebuildColorSelect();
  document.title=dept==='bags'?'Prada 女裝手袋目錄':'Prada 女裝成衣目錄';
  $('pageTitle').textContent=dept==='bags'?'PRADA 女裝手袋目錄':'PRADA 女裝成衣目錄';
  const allowed=(dept==='bags'?MAT_BAGS:MAT_RTW).map(([k])=>k);
  if(matCat && !allowed.includes(matCat)){ matCat=''; leatherType=''; }
  rebuildMatSelects();
  render();
}
fetch('data.json?v='+DATA_VER).then(r=>{if(!r.ok)throw new Error('load');return r.json()}).then(d=>{
 ALL=(d.products||[]).map(p=>{if(!p.department)p.department='bags';return p;});
 $('dept').addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(!b)return;setDept(b.getAttribute('data-d'))});
 $('cat').addEventListener('change',()=>{tab=$('cat').value||'';if(!OW_TABS.has(tab))owLen='';render()});
 $('matCat').addEventListener('change',()=>{
   matCat=$('matCat').value||'';
   if(matCat!=='leather') leatherType='';
   rebuildLeatherSelect();
   render();
 });
 $('leatherType').addEventListener('change',()=>{leatherType=$('leatherType').value||'';render()});
 $('owLen').addEventListener('change',()=>{owLen=$('owLen').value||'';render()});
 $('colorBtn').addEventListener('click',e=>{
   e.stopPropagation();
   const open=$('colorMenu').hidden;
   if(open){ $('colorMenu').hidden=false; $('colorBtn').setAttribute('aria-expanded','true'); }
   else closeColorMenu();
 });
 $('colorMenu').addEventListener('click',e=>{
   const b=e.target.closest('button[data-v],button.color-opt');
   if(!b)return;
   setColorValue(b.getAttribute('data-v')||'');
   render();
 });
 document.addEventListener('click',e=>{
   if(!e.target.closest('#colorWrap')) closeColorMenu();
 });
 ['q','line','price','sort'].forEach(i=>$(i).addEventListener('input',render));
 setDept('bags');
}).catch(()=>{$('count').textContent='載入失敗，請重新整理';});
function render(){
 rebuildOwSelect();
 const q=$('q').value.trim().toLowerCase(),[lo,hi]=($('price').value||'0-9999999').split('-').map(Number);
 let r=P.filter(p=>{
  if(tab && !(p.subcats||[]).includes(tab)) return false;
  if($('line').value && p.line!==$('line').value) return false;
  if($('color').value && p.color_group!==$('color').value) return false;
  if(matCat && matCatOf(p)!==matCat) return false;
  if(leatherType && !(matCatOf(p)==='leather' && leatherOf(p)===leatherType)) return false;
  if(owLen){
    if(owOf(p)!==owLen) return false;
  }
  if(!(p.price>=lo && p.price<hi)) return false;
  if(q && !(p.name_en+' '+p.name_zh+' '+p.code+' '+p.color_zh+' '+p.color_en+(p.material||'')).toLowerCase().includes(q)) return false;
  return true;
 });
 if($('sort').value=='pa')r.sort((a,b)=>a.price-b.price);if($('sort').value=='pd')r.sort((a,b)=>b.price-a.price);
 const label=dept==='bags'?'手袋':'成衣';
 $('count').textContent=r.length?`共 ${r.length} 款${label}`:`呢個篩選冇貨品（0 款）`;
 $('grid').innerHTML=r.length?r.map(p=>{
  const lenTag=owOf(p)==='long'?' · 長外套':owOf(p)==='short'?' · 短外套':'';
  return `<div class="card${sel.has(p.code)?' sel':''}" data-c="${p.code}">
 <label><input type="checkbox" ${sel.has(p.code)?'checked':''}> 揀</label>
 <a href="${p.url}" target="_blank"><img loading="lazy" src="${p.image}" alt=""></a><div class="b">
 <div class="nm">${esc(p.name_zh)}</div><div class="cd">${p.code}</div>
 <div><span class="dot" style="background:${(p.color_hex||'#ccc').split('#')[1]?('#'+(p.color_hex||'').split('#').filter(Boolean)[0]):'#ccc'}"></span>${esc(p.color_zh)}${p.size?' · '+esc(p.size):''}</div>
 <div style="color:#666">${esc(p.line||(p.subcat_zh||[])[0]||'')}${(p.line||(p.subcat_zh||[])[0]||p.material||matCatOf(p))?' · ':''}${esc(p.material||matLabel(p))}${lenTag}</div>
 <div class="pr">${fmt(p.price)}</div></div></div>`;
 }).join(''):'<div class="empty">試吓撳「全部物料」，或者改其他篩選。</div>';
 upd();
}
$('grid').addEventListener('change',e=>{const c=e.target.closest('.card');if(!c)return;const k=c.dataset.c;e.target.checked?sel.add(k):sel.delete(k);c.classList.toggle('sel',e.target.checked);upd()});
function upd(){$('n').textContent=`已揀 ${sel.size} 款`;localStorage.setItem('sel',JSON.stringify([...sel]))}
$('clr').onclick=()=>{sel.clear();render()};
$('share').onclick=async()=>{if(!sel.size)return alert('請先揀至少一款');
 const url=new URL('share.html?ids='+[...sel].join(','),location.href).href;
 if(navigator.share){try{await navigator.share({title:'Prada 精選',url});return}catch(e){}}
 try{await navigator.clipboard.writeText(url);alert('連結已複製：\n'+url)}catch(e){prompt('複製呢條連結：',url)}};
</script></body></html>
